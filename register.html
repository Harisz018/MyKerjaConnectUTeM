<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MyKerjaConnect UTeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">MyKerjaConnectUTeM</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="form-container">
        <div class="registration-card">
            <h2>Create Your Account</h2>
            <form id="regForm" onsubmit="handleRegister(event)">
                <div class="radio-group">
                    <label><input type="radio" name="userType" value="student" checked> Student</label>
                    <label><input type="radio" name="userType" value="employer"> Employer</label>
                </div>
                <input type="text" id="regName" placeholder="Full Name" required>
                <input type="text" id="regMatric" placeholder="Matric Number" required>
                <input type="email" id="regEmail" placeholder="UTeM Email Address" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <div class="file-upload">
                    <label>Resume (PDF/Image):</label>
                    <input type="file" accept=".pdf,image/*">
                </div>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MyKerjaConnect UTeM | <a href="#">Contact Us</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
