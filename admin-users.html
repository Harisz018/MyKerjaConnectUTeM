<!DOCTYPE html>
<html>
<head>
    <title>Admin User Management</title>
    <link rel="stylesheet" href="design.css">
</head>

<body class="dashboard-body">

<div class="dashboard-header">
    <h1>MyKerjaConnectUTeM</h1>
    <h2 id="adminName">Welcome, Admin</h2>
</div>

<div class="dashboard-container">

    <div class="sidebar">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-users.html">Manage Users</a>
        <a href="admin-vacancies.html">Monitor Vacancies</a>
        <a href="admin-reports.html">System Reports</a>
        <a href="#" onclick="confirmSignOut()">Sign Out</a>
    </div>

    <div class="dashboard-content">
        <h1>Manage Users</h1>

        <div class="filter-section">
            <input type="text" id="userSearch" placeholder="Search Name/Email" onkeyup="searchUsers()">

            <select id="userFilter" onchange="searchUsers()">
                <option>All</option>
                <option>Student</option>
                <option>Employer</option>
            </select>

            <button onclick="searchUsers()">Filter</button>
        </div>

        <table class="application-table" id="userTable">
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
            <tr>
                <td>User A</td>
                <td>Student</td>
                <td>m@utem</td>
                <td>
                    <button onclick="editItem('User A')">Edit</button>
                    <button onclick="deleteRow(this)">Delete</button>
                </td>
            </tr>
            <tr>
                <td>User B</td>
                <td>Employer</td>
                <td>n@utem</td>
                <td>
                    <button onclick="editItem('User B')">Edit</button>
                    <button onclick="deleteRow(this)">Delete</button>
                </td>
            </tr>
        </table>

        <br>

        <button onclick="previousPage()">&lt;&lt; Previous</button>
        <button onclick="nextPage()">Next &gt;&gt;</button>
    </div>

</div>

<div class="dashboard-footer">
    <button onclick="contactUs()">Contact Us</button>
</div>

<script src="admin.js"></script>
</body>
</html>
