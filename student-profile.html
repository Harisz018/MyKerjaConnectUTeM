<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | MyKerjaConnect UTeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <header class="dashboard-header">
        <div class="logo">MyKerjaConnectUTeM</div>
        <div id="welcomeMessage">Welcome, (Name)</div>
    </header>

    <div class="dashboard-container">
        <nav class="sidebar" id="sidebar">
            <a href="student-dashboard.html">Dashboard</a>
            <a href="student-browsejobs.html">Browse Jobs</a>
            <a href="student-applications.html">Applications</a>
            <a href="student-profile.html" style="background: #e0eafc; color: #0056b3;">Profile</a>
            <a href="#" id="signOutBtn">Sign Out</a>
        </nav>

        <main class="dashboard-content">
            <h2>Manage Profile & Payment Attributes</h2>
            
            <form id="profileForm" class="profile-grid">
                <div class="profile-section">
                    <h3>Academic & Personal Data</h3>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label>Matric Number</label>
                        <input type="text" placeholder="Enter matric number">
                    </div>
                    <div class="form-group">
                        <label>Faculty</label>
                        <select>
                            <option>FTMK</option>
                            <option>FTKEK</option>
                            <option>FTKM</option>
                            <option>FTKIP</option>
                        </select>
                    </div>
                </div>

                <div class="profile-section">
                    <h3>Financial & Contact Details</h3>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="text" placeholder="Enter phone number">
                    </div>
                    <div class="form-group">
                        <label>Bank Name</label>
                        <select>
                            <option>Maybank</option>
                            <option>CIMB</option>
                            <option>Bank Islam</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Bank Account Number</label>
                        <input type="text" placeholder="Enter account number">
                    </div>
                    <button type="button" id="updateBtn" class="submit-btn" onclick="updateProfile()" style="width: auto; padding: 10px 20px; display: none;">Update Profile</button>
                </div>
            </form>
        </main>
    </div>

    <footer class="dashboard-footer">
        <a href="#">Contact Us</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
