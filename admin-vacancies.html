<!DOCTYPE html>
<html>
<head>
    <title>Admin Monitor Vacancies</title>
    <link rel="stylesheet" href="design.css">
</head>

<body class="dashboard-body">

<div class="dashboard-header">
    <h1>MyKerjaConnectUTeM</h1>
    <h2 id="adminName">Welcome, Admin</h2>
</div>

<div class="dashboard-container">

    <div class="sidebar">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-users.html">Manage Users</a>
        <a href="admin-vacancies.html">Monitor Vacancies</a>
        <a href="admin-reports.html">System Reports</a>
        <a href="#" onclick="confirmSignOut()">Sign Out</a>
    </div>

    <div class="dashboard-content">
        <h1>Monitor Vacancies</h1>

        <div class="filter-section">
            <input type="text" id="jobSearch" placeholder="Search by Job Title" onkeyup="searchJobs()">
            <input type="text" id="employerSearch" placeholder="Filter by Employer" onkeyup="searchJobs()">
            <button onclick="searchJobs()">Filter</button>
        </div>

        <table class="application-table" id="jobTable">
            <tr>
                <th>Job</th>
                <th>Employer</th>
                <th>Date Posted</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>Job A</td>
                <td>Employer A</td>
                <td>DD/MM/YY</td>
                <td>Active</td>
            </tr>
            <tr>
                <td>Job B</td>
                <td>Employer B</td>
                <td>DD/MM/YY</td>
                <td>Pending</td>
            </tr>
        </table>

        <br>

        <button onclick="previousPage()">&lt;&lt; Previous</button>
        <button onclick="nextPage()">Next &gt;&gt;</button>
    </div>

</div>

<div class="dashboard-footer">
    <button onclick="contactUs()">Contact Us</button>
</div>

<script src="admin.js"></script>
</body>
</html>
