<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard | MyKerjaConnectUTeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <header class="dashboard-header">
        <div class="logo">MyKerjaConnectUTeM</div>
        <div style="font-weight: 600;">Welcome, Employer</div>
    </header>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <a href="employer-dashboard.html" class="active" style="background: #e0eafc; color: #0056b3;">Dashboard</a>
            <a href="employer-manage-vacancies.html">Manage Vacancies</a>
            <a href="employer-review-apps.html">Review Apps</a>
            <a href="employer-profile.html">Profile</a>
            <a href="employer-signout.html">Sign Out</a>
        </aside>

        <main class="dashboard-content">
            
            <h2>Employer Vacancy Summary Monitor</h2>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3 style="font-size: 1.1rem; color: #555; font-weight: 600;">Total Posted Jobs</h3>
                    <h1 style="margin-top: 15px; font-size: 2rem; color: #333;">( )</h1>
                </div>
                <div class="stat-card">
                    <h3 style="font-size: 1.1rem; color: #555; font-weight: 600;">Pending Apps</h3>
                    <h1 style="margin-top: 15px; font-size: 2rem; color: #333;">( )</h1>
                </div>
                <div class="stat-card">
                    <h3 style="font-size: 1.1rem; color: #555; font-weight: 600;">Total Distributed Payout</h3>
                    <h1 style="margin-top: 15px; font-size: 2rem; color: #333;">( )</h1>
                </div>
            </div>

            <h3 style="margin-top: 30px; font-weight: 600;">Department Actions & Broadcast Alerts</h3>
            <div class="updates-box">
                <p style="color: #333; font-weight: 600;">Logs:</p>
            </div>

        </main>
    </div>

    <footer class="dashboard-footer">
        <a href="#" style="color: #666; text-decoration: none; font-size: 0.9rem;">Contact Us</a>
    </footer>

</body>
</html>
