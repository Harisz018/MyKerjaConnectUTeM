<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

<div class="app-container">
    <div class="dashboard-header">
        <h3>☰ MyKerjaConnectUTeM</h3>
        <h3>Welcome, (Admin)</h3>
    </div>

    <div class="dashboard-body">
        <div class="sidebar">
            <a href="admin-dashboard.html" class="active-menu">Dashboard</a>
            <a href="admin-users.html">Manage Users</a>
            <a href="admin-vacancies.html">Monitor Vacancies</a>
            <a href="admin-reports.html">System Reports</a>
            <a href="admin-signout.html">Sign Out</a>
        </div>

        <div class="main-content">
            <h3 class="section-title">Admin Control Panel</h3>

            <table class="admin-table">
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                <tr>
                    <td>User A</td>
                    <td>Student</td>
                    <td>Inactive</td>
                    <td>
                        <button onclick="editItem('User A')">Edit</button>
                        <button onclick="deleteRow(this)">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>User B</td>
                    <td>Employer</td>
                    <td>Active</td>
                    <td>
                        <button onclick="editItem('User B')">Edit</button>
                        <button onclick="deleteRow(this)">Delete</button>
                    </td>
                </tr>
            </table>

            <h3 class="section-title">Vacancy Supervision</h3>

            <table class="admin-table">
                <tr>
                    <th>Job Title</th>
                    <th>Employer</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
                <tr>
                    <td>Job A</td>
                    <td>Employer A</td>
                    <td>DD/MM/YYYY</td>
                    <td>
                        <button onclick="deleteRow(this)">Remove</button>
                    </td>
                </tr>
            </table>

            <button class="admin-btn full-btn" onclick="generateReport()">Generate & Export System Report (PDF)</button>

            <div class="admin-pagination">
                <button onclick="previousPage()">&lt;&lt; Previous</button>
                <span>Page 1 of 5</span>
                <button onclick="nextPage()">Next &gt;&gt;</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="contact-btn" onclick="contactUs()">Contact Us</button>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
