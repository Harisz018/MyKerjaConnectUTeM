<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="design.css">
</head>

<body class="dashboard-body">

<div class="dashboard-header">
    <h1>MyKerjaConnectUTeM</h1>
    <h2 id="adminName">Welcome, Admin</h2>
</div>

<div class="dashboard-container">

    <div class="sidebar">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-users.html">Manage Users</a>
        <a href="admin-vacancies.html">Monitor Vacancies</a>
        <a href="admin-reports.html">System Reports</a>
        <a href="#" onclick="confirmSignOut()">Sign Out</a>
    </div>

    <div class="dashboard-content">
        <h1>Admin Control Panel</h1>

        <table class="application-table">
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            <tr>
                <td>User A</td>
                <td>Student</td>
                <td>Inactive</td>
                <td>
                    <button onclick="editItem('User A')">Edit</button>
                    <button onclick="deleteRow(this)">Delete</button>
                </td>
            </tr>
            <tr>
                <td>User B</td>
                <td>Employer</td>
                <td>Active</td>
                <td>
                    <button onclick="editItem('User B')">Edit</button>
                    <button onclick="deleteRow(this)">Delete</button>
                </td>
            </tr>
        </table>

        <br>

        <h1>Vacancy Supervision</h1>

        <table class="application-table">
            <tr>
                <th>Job Title</th>
                <th>Employer</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
            <tr>
                <td>Job A</td>
                <td>Employer A</td>
                <td>DD/MM/YYYY</td>
                <td>
                    <button onclick="deleteRow(this)">Remove</button>
                </td>
            </tr>
        </table>

        <br>

        <button onclick="generateReport()">Generate & Export System Report (PDF)</button>
    </div>

</div>

<div class="dashboard-footer">
    <button onclick="contactUs()">Contact Us</button>
</div>

<script src="admin.js"></script>
</body>
</html>
