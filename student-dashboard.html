<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | MyKerjaConnect UTeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <header class="dashboard-header">
        <div class="logo">MyKerjaConnectUTeM</div>
        <div>Welcome, (Name)</div>
    </header>

    <div class="dashboard-container">
        <nav class="sidebar" id="sidebar">
            <a href="student-dashboard.html">Dashboard</a>
            <a href="student-browsejobs.html">Browse Jobs</a>
            <a href="student-applications.html">Applications</a>
            <a href="student-profile.html">Profile</a>
            <a href="student-logout.html" id="signOutBtn">Sign Out</a>
        </nav>

        <main class="dashboard-content">
            <section class="performance-summary">
                <h2>Student Performance Summary Monitor</h2>
                <div class="stats-grid">
                    <div class="stat-card">Total Applied<br><strong>( )</strong></div>
                    <div class="stat-card">Approved<br><strong>( )</strong></div>
                    <div class="stat-card">Total Earnings<br><strong>( )</strong></div>
                </div>
            </section>

            <section class="alerts-section">
                <h3>System Broadcast Alerts & Updates</h3>
                <div class="updates-box">
                    <p>Updates:</p>
                </div>
            </section>
        </main>
    </div>

    <footer class="dashboard-footer">
        <a href="#">Contact Us</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
