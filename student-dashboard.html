<!DOCTYPE html>
<html>
<head>
    <title>Employer Dashboard</title>
    <link rel="stylesheet" href="design.css">
</head>
<body class="dashboard-body">

<div class="dashboard-header">
    <h3>☰ MyKerjaConnectUTeM</h3>
    <h3>Welcome, (Employer)</h3>
</div>

<div class="dashboard-container">
    <div class="sidebar">
        <a href="employer-dashboard.html">Dashboard</a>
        <a href="employer-vacancies.html">Manage Vacancies</a>
        <a href="employer-review.html">Review Apps</a>
        <a href="employer-profile.html">Profile</a>
        <a href="employer-signout.html">Sign Out</a>
    </div>

    <div class="dashboard-content">
        <h2>Employer Vacancy Summary Monitor</h2>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Posted Jobs</h3>
                <p id="postedJobs">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending Apps</h3>
                <p id="pendingApps">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Distributed Payout</h3>
                <p id="payout">RM 0</p>
            </div>
        </div>

        <div class="updates-box">
            <h3>Department Actions & Broadcast Alerts</h3>
            <br>
            <p>Logs:</p>
            <p id="logText">No new logs.</p>
        </div>

        <div class="employer-pagination">
            <button onclick="previousEmployerPage()">&lt;&lt; Previous</button>
            <span>Page 1 of 5</span>
            <button onclick="nextEmployerPage()">Next &gt;&gt;</button>
        </div>
    </div>
</div>

<div class="dashboard-footer">
    <button class="contact-btn" onclick="contactEmployer()">Contact Us</button>
</div>

<script src="employer.js"></script>
</body>
</html>
