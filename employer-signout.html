<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Out | MyKerjaConnectUTeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <header class="dashboard-header">
        <div class="logo">MyKerjaConnectUTeM</div>
        <div style="font-weight: 600;">Welcome, Employer</div>
    </header>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <a href="employer-dashboard.html">Dashboard</a>
            <a href="employer-manage-vacancies.html">Manage Vacancies</a>
            <a href="employer-review-apps.html">Review Apps</a>
            <a href="employer-profile.html">Profile</a>
            <a href="index.html" onclick="return sahkanLogKeluar()" class="active" style="background: #e0eafc; color: #0056b3;">Sign Out</a>
        </aside>

        <main class="dashboard-content" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
            <p style="color: #888; font-style: italic;">Processing sign out confirmation...</p>
        </main>
    </div>

    <footer class="dashboard-footer">
        <a href="#" style="color: #666; text-decoration: none; font-size: 0.9rem;">Contact Us</a>
    </footer>

    <script>
        // Jalankan pop-up secara automatik sebaik sahaja halaman ini dimuatkan
        window.onload = function() {
            sahkanLogKeluarDirect();
        };

        function sahkanLogKeluar() {
            return confirm("Sign Out of MyKerjaConnectUTeM?");
        }

        function sahkanLogKeluarDirect() {
            var respons = confirm("Sign Out of MyKerjaConnectUTeM?");
            if (respons) {
                window.location.href = "index.html"; // Jika OK, pergi ke index
            } else {
                window.location.href = "employer-dashboard.html"; // Jika Cancel, patah balik ke Dashboard
            }
        }
    </script>

</body>
</html>
